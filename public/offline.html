<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2340E0">
<title>Sem conexão</title>
<!-- Servida pelo service worker quando a rede cai. HTML puro, sem JS do
     Next: não depende de nenhum arquivo que muda a cada deploy. -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F6F7FB; color: #14172B; }
  main { text-align: center; max-width: 380px; }
  .icon { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px; background: #2340E0; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #4A4F6A; line-height: 1.5; margin: 0 0 24px; }
  button { background: #2340E0; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #FFD43B; outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    body { background: #14172B; color: #F6F7FB; }
    p { color: #B8BCD6; }
  }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2.1-1.6"/><path d="M22 8.8a15 15 0 0 0-11.3-3.8"/><path d="m2 2 20 20"/></svg>
  </div>
  <h1>Sem conexão</h1>
  <p>Não deu para carregar a página porque o aparelho está sem internet. Assim que a conexão voltar, toque em tentar de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
<script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
